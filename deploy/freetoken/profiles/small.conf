# /etc/palkia/freetoken/palkia-ft-small.conf   (root:root, 0644)
#
# Sourced by /usr/local/sbin/palkia-ft-launch. Keep FT_PORT / FT_CONTEXT /
# FT_MAX_RUNNING in step with the 'small' entry in Palkia.Core.Ai.ModelProfileCatalog
# (or the FreeToken:Profiles overrides in appsettings) - none is derived from another.
#
# Small: Qwen3.5-2B. May coexist with Fast. FT_MEMORY_RATIO is a fraction of FREE VRAM, so the Small+Fast ratios assume Small starts FIRST (0.40 of ~11.5GB, then Fast takes 0.45 of what is left); Fast first would leave Small too little. Unmeasured starting values.

FT_MODEL="/var/lib/palkia-models/Qwen3.5-2B"
FT_SERVED_NAME="qwen3.5-2b"
FT_PORT=1920

FT_CONTEXT=65536
FT_PREFILL=8192
FT_MAX_OUTPUT=4096
FT_MAX_RUNNING=2

# Fraction of FREE VRAM at start that ft may use (weights + expert cache + KV).
# Roughly lease_vram / free_vram_at_start. Starting values - measure and tune.
FT_MEMORY_RATIO=0.40

# start_pre refuses to start if less than this is free (deployment rules s7).
FT_MIN_FREE_VRAM_MB=4096
FT_MIN_AVAILABLE_RAM_MB=2048

# empty = ft's auto rule (dense -> fused, MoE -> offload). See ft serve --help.
FT_MOE_STRATEGY=""

# 1 = --text-model-only: skip any vision tower so its VRAM goes to KV/experts.
FT_TEXT_ONLY=1
