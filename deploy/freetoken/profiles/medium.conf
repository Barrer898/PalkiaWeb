# /etc/palkia/freetoken/palkia-ft-medium.conf   (root:root, 0644)
#
# Sourced by /usr/local/sbin/palkia-ft-launch. Keep FT_PORT / FT_CONTEXT /
# FT_MAX_RUNNING in step with the 'medium' entry in Palkia.Core.Ai.ModelProfileCatalog
# (or the FreeToken:Profiles overrides in appsettings) - none is derived from another.
#
# Medium: Qwen3.5-9B, dense, GPU-resident. bf16 is ~18GB and will NOT fit a 12GB card: this directory must hold a quantized (FP8/NVFP4) checkpoint whose kernel path works on sm_86. Verify short prompt, then 64K, then 96-110K.

FT_MODEL="/var/lib/palkia-models/Qwen3.5-9B"
FT_SERVED_NAME="qwen3.5-9b"
FT_PORT=1921

FT_CONTEXT=65536
FT_PREFILL=8192
FT_MAX_OUTPUT=8192
FT_MAX_RUNNING=1

# Fraction of FREE VRAM at start that ft may use (weights + expert cache + KV).
# Roughly lease_vram / free_vram_at_start. Starting values - measure and tune.
FT_MEMORY_RATIO=0.85

# start_pre refuses to start if less than this is free (deployment rules s7).
FT_MIN_FREE_VRAM_MB=10240
FT_MIN_AVAILABLE_RAM_MB=3072

# empty = ft's auto rule (dense -> fused, MoE -> offload). See ft serve --help.
FT_MOE_STRATEGY=""

# 1 = --text-model-only: skip any vision tower so its VRAM goes to KV/experts.
FT_TEXT_ONLY=1
