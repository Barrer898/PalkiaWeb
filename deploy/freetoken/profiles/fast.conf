# /etc/palkia/freetoken/palkia-ft-fast.conf   (root:root, 0644)
#
# Sourced by /usr/local/sbin/palkia-ft-launch. Keep FT_PORT / FT_CONTEXT /
# FT_MAX_RUNNING in step with the 'fast' entry in Palkia.Core.Ai.ModelProfileCatalog
# (hardcoded there: change both, rebuild) - none is derived from another.
#
# Fast: Qwen3.5-0.8B. Start AFTER Small if both run (see small.conf). Test 64K only after 32K is stable.

FT_MODEL="/var/lib/palkia-models/Qwen3.5-0.8B"
FT_SERVED_NAME="qwen3.5-0.8b"
FT_PORT=1919

FT_CONTEXT=32768
FT_PREFILL=8192
FT_MAX_OUTPUT=4096
FT_MAX_RUNNING=4

# Fraction of FREE VRAM at start that ft may use (weights + expert cache + KV).
# Roughly lease_vram / free_vram_at_start. Starting values - measure and tune.
FT_MEMORY_RATIO=0.45

# start_pre refuses to start if less than this is free (deployment rules s7).
FT_MIN_FREE_VRAM_MB=3072
FT_MIN_AVAILABLE_RAM_MB=1536

# empty = ft's auto rule (dense -> fused, MoE -> offload). See ft serve --help.
FT_MOE_STRATEGY=""

# 1 = --text-model-only: skip any vision tower so its VRAM goes to KV/experts.
FT_TEXT_ONLY=1
