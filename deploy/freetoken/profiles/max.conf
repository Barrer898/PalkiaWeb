# /etc/palkia/freetoken/palkia-ft-max.conf   (root:root, 0644)
#
# Sourced by /usr/local/sbin/palkia-ft-launch. Keep FT_PORT / FT_CONTEXT /
# FT_MAX_RUNNING in step with the 'max' entry in Palkia.Core.Ai.ModelProfileCatalog
# (or the FreeToken:Profiles overrides in appsettings) - none is derived from another.
#
# Max: Qwen3.6-35B-A3B (NVFP4), EXPERIMENTAL. Context 110576 matches the catalog; only try 128K after this is stable. If the .err log shows OOM kills or swap thrash, this profile is not viable at this config (deployment rules s7). NVFP4 on an RTX 3060 (sm_86): verify the quant backend; if auto picks wrongly set FT_EXTRA_ARGS="--quant-backend moe.nvfp4=marlin" (confirm spelling with 'ft serve --help').

FT_MODEL="/var/lib/palkia-models/Qwen3.6-35B-A3B"
FT_SERVED_NAME="qwen3.6-35b-a3b"
FT_PORT=1923

FT_CONTEXT=110576
FT_PREFILL=4096
FT_MAX_OUTPUT=8192
FT_MAX_RUNNING=1

# Fraction of FREE VRAM at start that ft may use (weights + expert cache + KV).
# Roughly lease_vram / free_vram_at_start. Starting values - measure and tune.
FT_MEMORY_RATIO=0.85

# start_pre refuses to start if less than this is free (deployment rules s7).
FT_MIN_FREE_VRAM_MB=10240
FT_MIN_AVAILABLE_RAM_MB=10240

# empty = ft's auto rule (dense -> fused, MoE -> offload). See ft serve --help.
FT_MOE_STRATEGY="offload"

# 1 = --text-model-only: skip any vision tower so its VRAM goes to KV/experts.
FT_TEXT_ONLY=1
