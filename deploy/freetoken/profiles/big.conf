# /etc/palkia/freetoken/palkia-ft-big.conf   (root:root, 0644)
#
# Sourced by /usr/local/sbin/palkia-ft-launch. Keep FT_PORT / FT_CONTEXT /
# FT_MAX_RUNNING in step with the 'big' entry in Palkia.Core.Ai.ModelProfileCatalog
# (or the FreeToken:Profiles overrides in appsettings) - none is derived from another.
#
# Big: gpt-oss-20B, MoE offload. Compare against FT_MOE_STRATEGY=hybrid (after 'ft bench bw') with identical context/prompt/concurrency before trusting either.

FT_MODEL="/var/lib/palkia-models/gpt-oss-20b"
FT_SERVED_NAME="gpt-oss-20b"
FT_PORT=1922

FT_CONTEXT=65536
FT_PREFILL=4096
FT_MAX_OUTPUT=8192
FT_MAX_RUNNING=1

# Fraction of FREE VRAM at start that ft may use (weights + expert cache + KV).
# Roughly lease_vram / free_vram_at_start. Starting values - measure and tune.
FT_MEMORY_RATIO=0.70

# start_pre refuses to start if less than this is free (deployment rules s7).
FT_MIN_FREE_VRAM_MB=8192
FT_MIN_AVAILABLE_RAM_MB=9216

# empty = ft's auto rule (dense -> fused, MoE -> offload). See ft serve --help.
FT_MOE_STRATEGY="offload"

# 1 = --text-model-only: skip any vision tower so its VRAM goes to KV/experts.
FT_TEXT_ONLY=0
